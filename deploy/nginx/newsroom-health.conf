# Optional: expose health only (TLS termination elsewhere).
# Include from sites-enabled after replacing UPSTREAM.

upstream newsroom_health {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name newsroom-health.example.com;

    location /health {
        proxy_pass http://newsroom_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /ready {
        proxy_pass http://newsroom_health;
    }
}
