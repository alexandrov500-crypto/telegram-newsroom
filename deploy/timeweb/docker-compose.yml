# Timeweb VPS production-lite stack.
# From this directory: cp .env.example .env && make up

name: telegram-newsroom-timeweb

services:
  newsroom:
    build:
      context: ../..
      dockerfile: deploy/timeweb/Dockerfile
    image: telegram-newsroom:timeweb-production
    container_name: telegram-newsroom
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      DATABASE_URL: sqlite+aiosqlite:////data/newsroom.db
      RUNTIME_STATE_DIR: /data/runtime
      NEWSROOM_BACKUP_DIR: /data/backups
      TELETHON_SESSION_PATH: ${TELETHON_SESSION_PATH:-/data/sessions/telethon.session}
      HEALTH_HTTP_PORT: ${HEALTH_HTTP_PORT:-8080}
      HEALTH_HTTP_BIND: 0.0.0.0
    volumes:
      # Host paths (create before first `make up`; owner uid 1000 = appuser in image)
      - ${NEWSROOM_HOST_DATA:-/opt/newsroom/data}:/data
      - ${NEWSROOM_HOST_LOGS:-/opt/newsroom/logs}:/data/logs
      - ${NEWSROOM_HOST_SESSIONS:-/opt/newsroom/sessions}:/data/sessions
    ports:
      - "${HEALTH_HTTP_PUBLISH_PORT:-127.0.0.1:8080}:8080"
    healthcheck:
      test: ["CMD", "python", "/app/docker/http_ready_probe.py"]
      interval: 60s
      timeout: 20s
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    working_dir: /app
    command: ["python", "-m", "app.main"]

