apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsroom-ingest
  namespace: newsroom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: newsroom-ingest
  template:
    metadata:
      labels:
        app: newsroom-ingest
    spec:
      containers:
        - name: newsroom
          image: newsroom:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: newsroom-config
            - secretRef:
                name: newsroom-secrets
          env:
            - name: NODE_ROLE
              value: ingest
            - name: NODE_REGION
              value: eu
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsroom-digest
  namespace: newsroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newsroom-digest
  template:
    metadata:
      labels:
        app: newsroom-digest
    spec:
      containers:
        - name: newsroom
          image: newsroom:latest
          envFrom:
            - configMapRef:
                name: newsroom-config
            - secretRef:
                name: newsroom-secrets
          env:
            - name: NODE_ID
              value: digest-1
            - name: NODE_ROLE
              value: digest
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: newsroom-ingest-hpa
  namespace: newsroom
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: newsroom-ingest
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: newsroom-ingest-pdb
  namespace: newsroom
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: newsroom-ingest
