apiVersion: v1
kind: Service
metadata:
  name: newsroom-redis
  namespace: newsroom
spec:
  selector:
    app: newsroom-redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsroom-redis
  namespace: newsroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newsroom-redis
  template:
    metadata:
      labels:
        app: newsroom-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
