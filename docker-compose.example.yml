# Minimal Compose example for local / small VPS trials (not a full HA stack).
# Usage:
#   cp .env.example .env   # fill secrets locally; never commit .env
#   docker compose -f docker-compose.example.yml up --build -d
# Optional Redis (for REDIS_ENABLED=true in .env):
#   docker compose -f docker-compose.example.yml --profile with-redis up --build -d

services:
  newsroom:
    build: .
    image: telegram-newsroom:local
    container_name: telegram-newsroom-example
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/newsroom.db
    volumes:
      - newsroom_data:/data
      - .:/app
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s

  redis:
    image: redis:7-alpine
    container_name: telegram-newsroom-redis-example
    restart: unless-stopped
    profiles:
      - with-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - newsroom_redis:/data

volumes:
  newsroom_data:
  newsroom_redis:
