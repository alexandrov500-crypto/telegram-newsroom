# Production Compose — infra init in /entrypoint.sh only; app rules in Python (startup_validation).
#
#   docker compose up -d --build --force-recreate

name: telegram-newsroom

services:
  newsroom:
    build: .
    image: telegram-newsroom:production
    container_name: telegram-ai-newsroom
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ./deploy/timeweb/.env
    environment:
      TZ: ${TZ:-UTC}
      DATABASE_URL: sqlite+aiosqlite:////data/newsroom.db
      RUNTIME_STATE_DIR: /data/runtime
      NEWSROOM_GLOBAL_LOCK_DIR: /data/runtime/locks
      NEWSROOM_LOCK_BY_BOT_TOKEN: "true"
      SEND_STARTUP_NOTIFICATION: "false"
      TELETHON_SESSION_PATH: ${TELETHON_SESSION_PATH:-/data/sessions/telethon.session}
      HEALTH_HTTP_PORT: ${HEALTH_HTTP_PORT:-8080}
      HEALTH_HTTP_BIND: 0.0.0.0
    volumes:
      - newsroom_data:/data
    ports:
      - "${HEALTH_HTTP_PUBLISH_PORT:-127.0.0.1:8080}:8080"
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 60s
      timeout: 20s
      start_period: 120s
      retries: 3
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true

volumes:
  newsroom_data:
