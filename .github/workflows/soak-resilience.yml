name: Soak resilience

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/soak/**"
      - "utils/runtime_drift_monitor.py"
      - "utils/scheduler_diagnostics.py"
      - "tools/evidence_retention.py"

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps
      - run: make soak-validate
